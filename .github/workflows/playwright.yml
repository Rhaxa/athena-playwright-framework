name: Playwright Cross-Browser Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' 

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t athena-playwright:ci .

      # This creates the report folder on the host machine first
      - name: Prepare report directory
        run: mkdir -p playwright-report

      # This uses -v to mount the volume
      - name: Run tests in Docker
        env:
          BASE_URL: 'https://www.saucedemo.com'
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
          BROWSER: ${{ matrix.browser }} 
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -e BASE_URL \
            -e STANDARD_USER \
            -e SECRET_PASSWORD \
            -e BROWSER \
            athena-playwright:ci \
            npx playwright test --project=$BROWSER

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 15